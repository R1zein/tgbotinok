// Use the same Telegram application registration as the gift and username watchers.
def esgramId = System.getenv('API_ID')?.trim()
def esgramHash = System.getenv('API_HASH')?.trim()
if (!(esgramId ==~ /[1-9][0-9]{0,9}/) || esgramId.toLong() > Integer.MAX_VALUE ||
        !(esgramHash ==~ /[0-9a-fA-F]{32}/)) {
    throw new GradleException('Set a valid Telegram API_ID and API_HASH before building Esgram.')
}
android.defaultConfig {
    buildConfigField 'int', 'ESGRAM_APP_ID', esgramId
    buildConfigField 'String', 'ESGRAM_APP_HASH', '"' + esgramHash + '"'
}
